<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House</title>
    <link rel="stylesheet" href="css/style.min.css" />
  </head>
  <body class="page">
    <header class="header">
      <div class="container header__container">
        <img
          src="icons/logo.svg"
          alt="Coffee House logo"
          class="header__logo"
        />
        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__item">
              <a href="favorite-coffee" class="header__link link"
                >Favorite coffee</a
              >
            </li>
            <li class="header__item">
              <a href="#about" class="header__link link">About</a>
            </li>
            <li class="header__item">
              <a href="#mobile-app" class="header__link link">Mobile app</a>
            </li>
            <li class="header__item">
              <a href="#contact-us" class="header__link link">Contact us</a>
            </li>
          </ul>
        </nav>
        <a href="menu.html" class="header__menu">
          <span class="header__menu-text link">Menu</span>
          <img
            src="icons/coffee-cup.svg"
            alt="coffee-cup"
            class="header__menu-img"
          />
        </a>
      </div>
    </header>
    <script src="js/main.js" defer></script>
    <script src="js/home.js" defer></script>
  </body>
</html>
